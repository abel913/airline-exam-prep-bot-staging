<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Registered Users')}"></head><body><header th:replace="~{admin/fragments :: header}"></header>
<div class="shell"><nav th:replace="~{admin/fragments :: nav}"></nav><main><h1>Registered Users</h1>
<div class="notice" th:if="${success}" th:text="${success}"></div><div class="notice error" th:if="${error}" th:text="${error}"></div>
<section class="panel table-panel"><table><thead><tr><th>User</th><th>Telegram identity</th><th>Contact</th><th>Verification</th><th>Current exam</th><th>Exams</th><th>Registered</th><th>Actions</th></tr></thead><tbody>
<tr th:each="u : ${users}"><td><a th:href="@{/admin/users/{id}(id=${u.id})}" th:text="${u.id}"></a></td><td th:text="${u.telegramId}"></td>
<td th:text="${u.phone == null ? 'Not captured before Phase 5' : u.phone}"></td><td th:text="${u.verification}"></td><td th:text="${u.currentExam}"></td><td th:text="${u.examCount}"></td><td th:text="${u.registered}"></td>
<td><div class="actions"><a class="link" th:href="@{/admin/users/{id}(id=${u.id})}">View</a><a class="danger-link" th:href="@{/admin/users/{id}/remove(id=${u.id})}">Remove User</a></div></td></tr>
</tbody></table><p class="empty" th:if="${users.isEmpty()}">No registered users.</p></section>
</main></div></body></html>
