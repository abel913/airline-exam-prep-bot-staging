spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require&connectTimeout=10&socketTimeout=30
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      connection-timeout: 15000
      validation-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 900000
      keepalive-time: 120000
server:
  address: 0.0.0.0
  port: ${PORT:10000}
  forward-headers-strategy: none
  tomcat:
    use-relative-redirects: true
    threads:
      max: 20
      min-spare: 2
    accept-count: 25
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax
telegram:
  bot:
    mode: ${TELEGRAM_MODE:WEBHOOK}
